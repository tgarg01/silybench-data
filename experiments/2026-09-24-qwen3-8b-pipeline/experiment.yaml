# Pipeline validation, not a published result. Kept (with every raw file) for transparency.
id: 2026-09-24-qwen3-8b-pipeline
title: "Qwen3-8B on 1x H100 SXM (GCP), pipeline validation"
status: pipeline
description: >-
  The runs used to build and debug the benchmark pipeline: BF16 performance, an accuracy
  re-run, and a full FP8 campaign, plus a smoke test. The code ran from uncommitted working
  trees; the exact code bundles (minus private Terraform state) are in the release.
bench:
  tag: pipeline-2026-09-24
  config: configs/qwen3-8b.yaml
environments:
  - provider: gcp
    machine_type: a3-highgpu-1g
    zone: us-central1-a
    provisioning: spot
    image: common-cu129-ubuntu-2404-nvidia-580 (image family, resolved at launch)
    runtime: docker
    terraform_env: h100-1g
runs:
  - 20260924T125045Z_h100-80gbx1_qwen3-8b_bf16
  - 20260924T222914Z_h100-80gbx1_qwen3-8b_bf16
  - 20260924T225750Z_h100-80gbx1_qwen3-8b_fp8
release: pipeline-2026-09-24
models:
- {hf_id: Qwen/Qwen3-8B, precision: bf16, checkpoint: Qwen/Qwen3-8B, max_model_len: 16384}
- {hf_id: Qwen/Qwen3-8B, precision: fp8, checkpoint: Qwen/Qwen3-8B, max_model_len: 16384}
scenarios:
- name: chat-128-128
  input_len: 128
  output_len: 128
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
- name: prefill-1024-128
  input_len: 1024
  output_len: 128
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
- name: decode-128-1024
  input_len: 128
  output_len: 1024
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
- name: balanced-2048-2048
  input_len: 2048
  output_len: 2048
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
- name: longctx-8192-512
  input_len: 8192
  output_len: 512
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}

