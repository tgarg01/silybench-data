# The first published experiment. status becomes `published` when its runs are merged.
id: 2026-10-qwen3.8-27b-h100
title: Qwen3.8-27B on 1x H100 SXM 80GB (GCP a3-highgpu-1g Spot)
status: planned
description: >-
  Serving performance of Qwen3.8-27B with vLLM 0.30.0 on one H100 SXM: BF16 (base checkpoint)
  and FP8 (Qwen's official FP8 checkpoint), six request shapes from short chat to 100k-token
  tool-calling agent contexts, latency percentiles and the most concurrent users served within
  the latency target. Performance only, plus a correctness suite for the 100k tool-calling
  scenario (long-context recall + a drift baseline); standard accuracy tests come later.
bench:
  repo: https://github.com/tgarg01/silybench-bench
  tag: exp-2026-10-qwen3.8-27b-h100
  commit: 3b108345f5a2ae3e89e1fb8595b1480740841ab9
  config: configs/qwen3.8-27b-h100.yaml
environments:
  - provider: gcp
    machine_type: a3-highgpu-1g
    zone: us-central1-a
    provisioning: spot
    image: common-cu129-ubuntu-2404-nvidia-580-v20260909
    runtime: docker
    terraform_env: h100-1g
runs: []
release: exp-2026-10-qwen3.8-27b-h100
# Run order: the 100k tool-calling scenario first (both precisions, perf + quality suite),
# then the other five scenarios. Each phase is one `gpubench run` (watch.sh --phase).
phases:
  - --workload toolcall-100k-512
  - --skip-workload toolcall-100k-512
models:
- {hf_id: Qwen/Qwen3.8-27B, precision: bf16, checkpoint: Qwen/Qwen3.8-27B, max_model_len: 131072}
- {hf_id: Qwen/Qwen3.8-27B, precision: fp8, checkpoint: Qwen/Qwen3.8-27B-FP8, max_model_len: 131072}
scenarios:
- name: toolcall-100k-512
  input_len: 100000
  output_len: 512
  dataset: custom
  users: [1, 2, 4, 8]
  repeats: 3
  slo: {ttft_p99_ms: 30000.0, itl_median_ms: 50.0}
  quality: true
- name: chat-128-128
  input_len: 128
  output_len: 128
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false
- name: prefill-1024-128
  input_len: 1024
  output_len: 128
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false
- name: decode-128-1024
  input_len: 128
  output_len: 1024
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false
- name: balanced-2048-2048
  input_len: 2048
  output_len: 2048
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false
- name: longctx-8192-512
  input_len: 8192
  output_len: 512
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false

