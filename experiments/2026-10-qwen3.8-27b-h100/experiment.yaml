# The first published experiment. status becomes `published` when its runs are merged.
id: 2026-10-qwen3.8-27b-h100
title: Qwen3.8-27B on 1x H100 SXM 80GB (GCP a3-highgpu-1g Spot)
status: planned
description: >-
  Serving performance of Qwen3.8-27B with vLLM 0.30.0 on one H100 SXM: BF16 (base checkpoint)
  and FP8 (Qwen's official FP8 checkpoint), six request shapes from short chat to 100k-token
  tool-calling agent contexts, latency percentiles and the most concurrent users served within
  the latency target, plus two FP8 serving options on the 100k agent workloads (MTP speculative
  decoding, and prefix caching on 10-turn agent sessions). Performance only, plus a correctness suite for the 100k tool-calling
  scenario (long-context recall + a drift baseline); standard accuracy tests come later.
bench:
  repo: https://github.com/tgarg01/silybench-bench
  tag: exp-2026-10-qwen3.8-27b-h100.2
  commit: 5c24413982a6c02841c587df20257e863d04e4c6
  config: configs/qwen3.8-27b-h100.yaml
environments:
  - provider: gcp
    machine_type: a3-highgpu-1g
    zone: us-central1-a
    provisioning: spot
    image: common-cu129-ubuntu-2404-nvidia-580-v20260909
    runtime: docker
    terraform_env: h100-1g
runs: []
release: exp-2026-10-qwen3.8-27b-h100
# Run order. Each phase is one `gpubench run` (watch.sh --phase), selecting serving sessions by
# tag (<precision> or <precision>-<variant>):
#   1. the 100k tool-calling scenario on both precisions, with its quality suite;
#   2. FP8 + MTP speculative decoding on the same scenario;
#   3. multi-turn agent sessions: FP8 without / with prefix caching, and MTP + prefix caching;
#   4. the other five scenarios on both precisions.
phases:
  - --session bf16 --session fp8 --workload toolcall-100k-512
  - --session fp8-mtp --workload toolcall-100k-512
  - --session fp8 --session fp8-pc --session fp8-mtp-pc --workload agent-sessions-100k
  - --session bf16 --session fp8 --skip-workload toolcall-100k-512 --skip-workload agent-sessions-100k
models:
- {hf_id: Qwen/Qwen3.8-27B, precision: bf16, checkpoint: Qwen/Qwen3.8-27B, max_model_len: 131072}
- {hf_id: Qwen/Qwen3.8-27B, precision: fp8, checkpoint: Qwen/Qwen3.8-27B-FP8, max_model_len: 131072}
- hf_id: Qwen/Qwen3.8-27B
  precision: fp8
  variant: mtp
  checkpoint: Qwen/Qwen3.8-27B-FP8
  max_model_len: 131072
  serving_args:
    speculative-config: {method: mtp, num_speculative_tokens: 2}
    max-num-seqs: 256
- hf_id: Qwen/Qwen3.8-27B
  precision: fp8
  variant: pc
  checkpoint: Qwen/Qwen3.8-27B-FP8
  max_model_len: 131072
  serving_args: {no-enable-prefix-caching: false, enable-prefix-caching: true, mamba-cache-mode: align}
- hf_id: Qwen/Qwen3.8-27B
  precision: fp8
  variant: mtp-pc
  checkpoint: Qwen/Qwen3.8-27B-FP8
  max_model_len: 131072
  serving_args:
    speculative-config: {method: mtp, num_speculative_tokens: 2}
    max-num-seqs: 256
    no-enable-prefix-caching: false
    enable-prefix-caching: true
    mamba-cache-mode: align
scenarios:
- name: toolcall-100k-512
  input_len: 100000
  output_len: 512
  dataset: custom
  users: [1, 2, 4, 8]
  repeats: 3
  slo: {ttft_p99_ms: 30000.0, itl_median_ms: 50.0}
  quality: true
- name: agent-sessions-100k
  input_len: 100000
  output_len: 512
  dataset: sessions
  users: [1, 2, 3, 4, 6, 8, 10, 12]
  repeats: 2
  slo: {ttft_p99_ms: 30000.0, itl_median_ms: 50.0}
  quality: false
- name: chat-128-128
  input_len: 128
  output_len: 128
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false
- name: prefill-1024-128
  input_len: 1024
  output_len: 128
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false
- name: decode-128-1024
  input_len: 128
  output_len: 1024
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false
- name: balanced-2048-2048
  input_len: 2048
  output_len: 2048
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false
- name: longctx-8192-512
  input_len: 8192
  output_len: 512
  dataset: random
  users: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo: {ttft_p99_ms: 2000.0, itl_median_ms: 50.0}
  quality: false

