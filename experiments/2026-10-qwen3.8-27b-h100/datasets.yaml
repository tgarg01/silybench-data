- name: toolcall-100k-quality.jsonl
  scenario: toolcall-100k-512
  kind: quality
  description: >-
    Correctness suite from the same agent contexts, rendered with thinking off. 100 recall
    questions ("What was the first line of the output of the command X?") about tool outputs
    20-80% deep in the 100k context, each answer present exactly once, scored by exact match;
    and 100 drift prompts at the agent's next decision point (greedy, top-20 logprobs), the
    baseline an optimized build is compared with (gpubench quality compare).
  source: https://huggingface.co/datasets/nebius/SWE-agent-trajectories
  license: CC-BY-4.0
  builder: gpubench quality make --model Qwen/Qwen3.8-27B --tokens 100000 --count 100 --shards 4 --seed 42
